version: 2
project_name: embedstore

builds:
  - id: embedstore
    main: ./cmd/embedstore
    binary: embedstore
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - embedstore
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true
